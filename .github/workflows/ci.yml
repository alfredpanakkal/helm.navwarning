name: CI & Pipeline Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-applet:
    name: Verify Node & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck TypeScript (debug capture)
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc.log 2>&1
          TSC_EXIT=$?
          npx vite build > /tmp/vite.log 2>&1
          VITE_EXIT=$?
          echo "TSC_EXIT=$TSC_EXIT VITE_EXIT=$VITE_EXIT"
          {
            echo "### CI Debug Output (PR #17)"
            echo '```'
            cat /tmp/tsc.log
            echo '--- vite ---'
            tail -n 60 /tmp/vite.log
            echo '```'
          } > /tmp/comment.md
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/alfredpanakkal/helm.navwarning/issues/17/comments" \
            -d "{\"body\": $(python3 -c "import json,sys;print(json.dumps(open('/tmp/comment.md').read()))")}" || true
          exit 1

  verify-scrapling:
    name: Verify Scrapling Ingestion Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scrapling Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install lxml cssselect tld w3lib

      - name: Run Scrapling Dry-Run Verification (NAVAREA I)
        run: |
          python scripts/scrapling_ingest.py --dry-run --navarea I --output ./ci-test-output.json

      - name: Validate Output JSON Artifact
        run: |
          test -f ./ci-test-output.json
          python -c "import json; data=json.load(open('./ci-test-output.json')); assert data['total_warnings'] >= 0, 'Extraction failed'"
