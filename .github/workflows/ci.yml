name: CI & Pipeline Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-applet:
    name: Verify Node & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck TypeScript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc.log 2>&1
          TSC_EXIT=$?
          cat /tmp/tsc.log
          if [ $TSC_EXIT -ne 0 ]; then
            {
              echo 'TSC failed on this branch:'
              echo '```'
              cat /tmp/tsc.log
              echo '```'
            } > /tmp/comment.md
            BODY=$(jq -Rs '{body: .}' /tmp/comment.md)
            curl -s -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/alfredpanakkal/helm.navwarning/issues/16/comments \
              -d "$BODY"
            exit 1
          fi

      - name: Build Applet Bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          npx vite build > /tmp/vite.log 2>&1
          VITE_EXIT=$?
          cat /tmp/vite.log
          if [ $VITE_EXIT -ne 0 ]; then
            {
              echo 'Vite build failed on this branch:'
              echo '```'
              tail -n 60 /tmp/vite.log
              echo '```'
            } > /tmp/comment.md
            BODY=$(jq -Rs '{body: .}' /tmp/comment.md)
            curl -s -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/alfredpanakkal/helm.navwarning/issues/16/comments \
              -d "$BODY"
            exit 1
          fi

  verify-scrapling:
    name: Verify Scrapling Ingestion Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scrapling Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install lxml cssselect tld w3lib

      - name: Run Scrapling Dry-Run Verification (NAVAREA I)
        run: |
          python scripts/scrapling_ingest.py --dry-run --navarea I --output ./ci-test-output.json

      - name: Validate Output JSON Artifact
        run: |
          test -f ./ci-test-output.json
          python -c "import json; data=json.load(open('./ci-test-output.json')); assert data['total_warnings'] >= 0, 'Extraction failed'"
