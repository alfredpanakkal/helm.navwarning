name: CI & Pipeline Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-applet:
    name: Verify Node & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh dependency lockfiles for artifact
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Set up Bun for lockfile refresh
        uses: oven-sh/setup-bun@v2

      - name: Refresh Bun lockfile
        run: bun install --lockfile-only

      - name: Upload refreshed dependency lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: voyage-planner-lockfiles
          path: |
            package-lock.json
            bun.lock
          if-no-files-found: error

      - name: Commit refreshed lockfiles to the PR branch
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync npm and bun lockfiles"
            git push origin "HEAD:${PR_BRANCH}"
          fi

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Vitest Test Suite (P0 safety + milestone acceptance suites)
        run: npm test

      - name: Build Applet Bundle
        run: npx vite build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Public Portal Browser Tests
        run: npx playwright test scripts/ux-audit/tests/public-portal-performance.spec.ts
