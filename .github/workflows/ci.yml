name: CI & Pipeline Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-applet:
    name: Verify Node & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run P0 Safety Regression Tests (vitest)
        run: |
          set -o pipefail
          npx vitest run src/utils/__tests__/p0SafetyRegression.test.ts 2>&1 | tee /tmp/vitest.log

      - name: Build Applet Bundle
        run: npx vite build

      - name: Report vitest log to PR
        if: always()
        run: |
          if [ ! -f /tmp/vitest.log ]; then echo "vitest log was never produced" > /tmp/vitest.log; fi
          PAYLOAD=$(jq -Rs "{body: (\"### vitest output (last 12KB)\\n\\n~~~\\n\" + . + \"\\n~~~\\n\")}" < <(tail -c 12000 /tmp/vitest.log))
          curl -s -f -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/alfredpanakkal/helm.navwarning/issues/46/comments" \
            -d "$PAYLOAD"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-scrapling:
    name: Verify Scrapling Ingestion Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scrapling Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install lxml cssselect tld w3lib

      - name: Run Scrapling Dry-Run Verification (NAVAREA I)
        run: |
          python scripts/scrapling_ingest.py --dry-run --navarea I --output ./ci-test-output.json

      - name: Validate Output JSON Artifact
        run: |
          test -f ./ci-test-output.json
          python -c "import json; data=json.load(open('./ci-test-output.json')); assert data['total_warnings'] >= 0, 'Extraction failed'"
