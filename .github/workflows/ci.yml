name: CI & Pipeline Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  verify-applet:
    name: Verify Node & TypeScript Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck TypeScript
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee tsc.log

      - name: Run P0 Safety Regression Tests (vitest)
        run: |
          set -o pipefail
          npx vitest run src/utils/__tests__/p0SafetyRegression.test.ts 2>&1 | tee vitest.log

      - name: Build Applet Bundle
        run: |
          set -o pipefail
          npx vite build 2>&1 | tee build.log

      - name: Report failure on PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          printf 'CI verify-applet failed on commit %s.\n' "$(git rev-parse --short HEAD)" > /tmp/ci-fail-comment.md
          for f in tsc.log vitest.log build.log; do
            if [ -s "$f" ]; then printf '\n### tail of %s\n\`\`\`\n' "$f" >> /tmp/ci-fail-comment.md; tail -c 4000 "$f" >> /tmp/ci-fail-comment.md; printf '\n\`\`\`\n' >> /tmp/ci-fail-comment.md; fi
          done
          gh pr comment "$PR_NUMBER" --body-file /tmp/ci-fail-comment.md || true
  verify-scrapling:
    name: Verify Scrapling Ingestion Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scrapling Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install lxml cssselect tld w3lib

      - name: Run Scrapling Dry-Run Verification (NAVAREA I)
        run: |
          python scripts/scrapling_ingest.py --dry-run --navarea I --output ./ci-test-output.json

      - name: Validate Output JSON Artifact
        run: |
          test -f ./ci-test-output.json
          python -c "import json; data=json.load(open('./ci-test-output.json')); assert data['total_warnings'] >= 0, 'Extraction failed'"
