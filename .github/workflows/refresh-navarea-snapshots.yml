name: Refresh NAVAREA warning snapshots

on:
  pull_request:
    paths:
      - 'public/assets/js/navarea-page.js'
      - 'scripts/navarea-pages/**'
      - 'vercel.json'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths-ignore:
      - 'public/navarea/**/warnings.json'
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: navarea-warning-snapshots
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh warning snapshots
        run: node scripts/navarea-pages/refresh-warning-snapshots.mjs
      - name: Commit changed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/navarea/*/warnings.json
          if git diff --cached --quiet; then
            echo "No NAVAREA snapshot changes."
          else
            git commit -m "chore: refresh NAVAREA warning snapshots"
            git push
          fi
