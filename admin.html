<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Helm.Warning — Admin Gateway</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/components.css">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--surface-dark);font:400 15px system-ui}
.card{background:var(--surface);border-radius:16px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;font:600 20px system-ui;color:#fff}
.logo .badge{width:40px;height:40px;background:#fff;color:var(--surface-dark);border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.sub{text-align:center;color:var(--text-light);font-size:13px;margin-bottom:24px}
.notice{background:#eff6ff;color:#1d4ed8;padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.5;margin-bottom:20px}
.notice a{color:#1d4ed8;font-weight:600}
label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--text-light);margin-bottom:6px}
input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font:400 15px system-ui;background:var(--surface);color:var(--text);margin-bottom:16px;min-height:48px;box-sizing:border-box}
input:focus{outline:none;border-color:var(--text-muted)}
.error{background:#fef2f2;color:var(--critical);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none}
.links{margin-top:20px;text-align:center;display:flex;flex-direction:column;gap:8px}
.links a{font-size:13px;color:var(--text-light);text-decoration:none}
.links a:hover{color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span class="badge">HW</span> Helm.Warning</div>
  <div class="sub">Admin Gateway — restricted access</div>

  <div class="notice">
    The legacy single-file admin console has been retired. Sign in here to be
    redirected to the unified React admin console (Data Bank tools, manual
    parser, imports, audit and Supabase views).
  </div>

  <div class="error" id="loginError"></div>
  <form onsubmit="handleLogin(event)" id="loginForm">
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" placeholder="admin@helm.warning" autocomplete="username" required>
    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
    <button class="btn btn-primary" type="submit" id="loginBtn" style="width:100%">Sign In &amp; Continue</button>
  </form>

  <div class="links">
    <a href="/">← Back to public site</a>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/assets/js/supabase.js"></script>
<script>
'use strict';

var ADMIN_EMAILS = ['alfredpanakkal47@gmail.com'];

function showError(msg) {
  var el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}

function isAdminUser(user) {
  if (!user) return false;
  var role = (user.app_metadata && user.app_metadata.role) || '';
  if (String(role).toLowerCase() === 'admin') return true;
  return ADMIN_EMAILS.indexOf(String(user.email || '').toLowerCase()) !== -1;
}

function enterAdminMode(email) {
  try {
    localStorage.setItem('helm_admin_mode', 'true');
    localStorage.setItem('hw_admin_email', String(email || ''));
  } catch (e) { /* storage unavailable */ }
  window.location.replace('/#/databank');
}

async function checkExistingSession() {
  try {
    if (!window.hwSupabase) return;
    var s = await window.hwSupabase.auth.getSession();
    var session = s && s.data && s.data.session;
    if (session && session.access_token && isAdminUser(session.user)) {
      enterAdminMode(session.user.email);
    }
  } catch (e) { /* stay on gate */ }
}

async function handleLogin(event) {
  event.preventDefault();
  showError('');
  var btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    if (!window.hwSupabase) {
      throw new Error('Supabase client unavailable. Reload the page.');
    }
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var res = await window.hwSupabase.auth.signInWithPassword({ email: email, password: password });
    if (res.error) throw new Error(res.error.message);
    var user = res.data && res.data.user;
    if (!isAdminUser(user)) {
      await window.hwSupabase.auth.signOut();
      throw new Error('This account is not authorized as an admin.');
    }
    enterAdminMode(user.email);
  } catch (err) {
    showError((err && err.message) ? err.message : 'Sign-in failed. Check your credentials.');
    btn.disabled = false;
    btn.textContent = 'Sign In & Continue';
  }
}

checkExistingSession();
</script>
</body>
</html>
