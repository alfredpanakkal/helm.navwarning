<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Helm.Warning — Admin Gateway</title>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/components.css">
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--canvas, #ffffff);
  color: var(--ink-body, #1f2937);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: var(--fs-body, 0.9rem);
  font-weight: 400;
}
.login-box {
  width: 100%;
  max-width: 380px;
  border: 1px solid var(--hairline, #eef1f4);
  border-radius: 12px;
  padding: 32px;
  background: var(--canvas, #ffffff);
}
.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 1.15rem;
  font-weight: 500;
  color: var(--ink-primary, #0b0e11);
}
.logo img {
  width: 24px;
  height: 24px;
}
.sub {
  text-align: center;
  color: var(--ink-secondary, #5f6b7a);
  font-size: 0.85rem;
  margin-bottom: 24px;
}
.notice {
  background: var(--surface-subtle, #fafbfc);
  color: var(--ink-secondary, #5f6b7a);
  border: 1px solid var(--hairline, #eef1f4);
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 0.8rem;
  line-height: 1.5;
  margin-bottom: 20px;
}
label {
  display: block;
  font-size: var(--fs-label, 0.7rem);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-tertiary, #8b97a5);
  margin-bottom: 6px;
}
input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border-input, #dde2e8);
  border-radius: var(--radius-input, 12px);
  font-size: 0.95rem;
  background: var(--canvas, #ffffff);
  color: var(--ink-primary, #0b0e11);
  margin-bottom: 16px;
  min-height: 44px;
  box-sizing: border-box;
  transition: border-color var(--transition, 0.12s ease), box-shadow var(--transition, 0.12s ease);
}
input:focus {
  outline: none;
  border-color: var(--accent, #2b6e8c);
  box-shadow: 0 0 0 3px var(--accent-halo, rgba(43,110,140,0.10));
}
.btn-submit {
  width: 100%;
  padding: 10px 16px;
  border: 1px solid var(--border-input, #dde2e8);
  border-radius: var(--radius-btn, 6px);
  background: transparent;
  color: var(--accent, #2b6e8c);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition, 0.12s ease);
}
.btn-submit:hover:not(:disabled) {
  border-color: var(--accent, #2b6e8c);
  background: var(--surface-subtle, #fafbfc);
}
.btn-submit:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.error {
  border: 1px solid var(--border-input, #dde2e8);
  color: var(--sev-critical, #c44536);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 0.8rem;
  margin-bottom: 16px;
  display: none;
}
.links {
  margin-top: 24px;
  text-align: center;
}
.links a {
  font-size: 0.8rem;
  color: var(--ink-secondary, #5f6b7a);
  text-decoration: none;
  transition: color var(--transition, 0.12s ease);
}
.links a:hover {
  color: var(--accent, #2b6e8c);
}
</style>
</head>
<body>
<div class="login-box">
  <div class="logo"><img src="/favicon.svg" alt=""> Helm.Warning</div>
  <div class="sub">Admin gateway — restricted access</div>

  <div class="notice">
    Sign in to access administrative tools including Data Bank operations, manual parser, imports, and audit ledger.
  </div>

  <div class="error" id="loginError" role="alert"></div>
  <form onsubmit="handleLogin(event)" id="loginForm">
    <label for="loginEmail">Email</label>
    <input type="email" id="loginEmail" placeholder="admin@helm.warning" autocomplete="username" required>
    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
    <button class="btn-submit" type="submit" id="loginBtn">Sign In &amp; Continue</button>
  </form>

  <div class="links">
    <a href="/navarea">← Back to public portal</a>
  </div>
</div>

<script defer src="https://unpkg.com/@supabase/supabase-js@2.117.3/dist/umd/supabase.js" integrity="sha256-1qXEQUpdTOZG2cHeIjqnBn0/9mTBU5T/63/P/HYzVKM=" crossorigin="anonymous"></script>
<script defer src="/assets/js/supabase.js"></script>
<script>
'use strict';


function showError(msg) {
  var el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

// UX-only hint read from the user's own session. The sole authorization
// boundary is server-side: server/auth.ts requireAdmin / verifyAdminRequest
// guard every /api/admin/* route and all admin mutating endpoints.
function isAdminUser(user) {
  if (!user) return false;
  var meta = (user && user.app_metadata) || {};
  return meta.role === 'admin' || meta.role === 'superadmin' || meta.is_admin === true;
}

function enterAdminMode() {
  // No client-side trust flags (helm_admin_mode / hw_admin_email) are written:
  // they were spoofable and conveyed no real authorization. The React console
  // derives admin mode from the server-verified session on mount.
  window.location.replace('/navarea/console#/warnings/list');
}

async function checkExistingSession() {
  try {
    if (!window.hwSupabase) return;
    var s = await window.hwSupabase.auth.getSession();
    var session = s && s.data && s.data.session;
    if (session && session.access_token && isAdminUser(session.user)) {
      enterAdminMode();
    }
  } catch (e) { /* stay on gate */ }
}

async function handleLogin(event) {
  event.preventDefault();
  showError('');
  var btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    if (!window.hwSupabase) {
      throw new Error('Supabase client unavailable. Reload the page.');
    }
    var email = document.getElementById('loginEmail').value.trim();
    var password = document.getElementById('loginPassword').value;
    var res = await window.hwSupabase.auth.signInWithPassword({ email: email, password: password });
    if (res.error) {
      // Map the expected auth outcomes to plain messages; never surface
      // raw provider internals (network/rate-limit details) on the page.
      var friendly = {
        'Invalid login credentials': 'Invalid email or password.',
        'Email not confirmed': 'Email not confirmed — check your inbox and try again.'
      };
      throw new Error(friendly[res.error.message] || 'Sign-in failed. Check your credentials.');
    }
    var user = res.data && res.data.user;
    if (!isAdminUser(user)) {
      await window.hwSupabase.auth.signOut();
      throw new Error('This account is not authorized as an admin.');
    }
    enterAdminMode();
  } catch (err) {
    showError((err && err.message) ? err.message : 'Sign-in failed. Check your credentials.');
    btn.disabled = false;
    btn.textContent = 'Sign In & Continue';
  }
}

window.addEventListener('DOMContentLoaded', checkExistingSession);
</script>
</body>
</html>
